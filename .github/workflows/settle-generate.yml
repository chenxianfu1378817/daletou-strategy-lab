name: Settle and Generate

on:
  schedule:
    - cron: '0 15 * * 1,3,6'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: settle-generate
  cancel-in-progress: false

jobs:
  settle-generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -e .
      - run: python scripts/update_draws.py
      - run: python scripts/validate_data.py
      - run: python scripts/generate_recommendation.py --budget 100 --mode 智能推荐
      - run: python scripts/build_web_data.py
      - name: Commit immutable paper recommendation
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add data/daletou.db data/raw web/public/data/app-data.json
          git diff --cached --quiet || git commit -m "data: settle and generate paper recommendation"
          git push

