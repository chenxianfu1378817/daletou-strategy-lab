name: Settle and Generate

on:
  workflow_run:
    workflows: ["Update Draws"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: settle-generate
  cancel-in-progress: false

jobs:
  settle-generate:
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -e .
      - run: python scripts/validate_data.py
      - run: python scripts/settle_paper_bets.py
      - run: python scripts/run_ablation.py --random-seeds 1000
      - run: python scripts/build_evidence.py
      - run: python scripts/generate_recommendation.py
      - run: python scripts/build_web_data.py
      - name: Commit immutable paper recommendation
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add data/daletou.db data/raw data/exports web/public/data/app-data.json
          git diff --cached --quiet || git commit -m "data: settle and generate paper recommendation"
          git push
